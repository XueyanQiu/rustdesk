name: Build Android APK

on:
  push:
    branches: [ master ]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'Cargo.toml'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'Cargo.toml'
  workflow_dispatch:  # 新增：允许手动触发
    # 可选：添加手动触发时的参数（如指定分支、构建类型等）
    inputs:
      build_type:
        description: '构建类型 (release/debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi, aarch64-linux-android, i686-linux-android, x86_64-linux-android

      - name: Install Android NDK and SDK
        uses: android-actions/setup-android@v3

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust libraries
        # 根据手动触发的参数决定构建类型（默认 release）
        run: |
          cd lib/rustdesk
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            cargo ndk -t armv7-linux-androideabi -t aarch64-linux-android -t i686-linux-android -t x86_64-linux-android -o ../android/app/src/main/jniLibs build --release
          else
            cargo ndk -t armv7-linux-androideabi -t aarch64-linux-android -t i686-linux-android -t x86_64-linux-android -o ../android/app/src/main/jniLibs build
          fi

      - name: Build APK
        run: |
          cd android
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi
        env:
          # 签名信息（若配置）
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: rustdesk-android-apk-${{ github.event.inputs.build_type }}
          path: android/app/build/outputs/apk/${{ github.event.inputs.build_type }}/*.apk
